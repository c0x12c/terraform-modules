name: Dependabot auto-merge
on:
  workflow_run:
    workflows: ['registry-tests', 'Module CI']
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # App-token merges trigger module release and registry deploy push workflows; GITHUB_TOKEN merges do not.
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3
        id: github-app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read

      # PR code never runs here because the script comes from the default branch.
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Merge green Dependabot and release PRs
        env:
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RELEASE_BOT: 'spartan-public-cicd[bot]'
          RELEASE_GATE: 'Module CI'
          PR_GATES: 'registry-tests|scripts/,tools/registry/,set-up-repositories/'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: .github/scripts/dependabot-auto-merge/merge-green-prs.sh
