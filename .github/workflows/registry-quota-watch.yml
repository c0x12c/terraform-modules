name: registry-quota-watch

# Workers Free is a HARD daily cap, not a throttle: past it the Worker stops
# serving until UTC midnight and every `terraform init` fails at once. Measured
# 2026-08-27 the peak day was 26,050 requests against 100,000, with a 15x spread
# between the quietest and busiest day - so the cliff is reachable on a bad day
# and invisible until it is hit. This judges yesterday's count and goes red while
# there is still room to act.
#
# The query spans two days because the current UTC day is still accumulating and
# would read artificially low. Only the most recent completed day is judged; the
# earlier one is printed as context.
#
# The limit is the repo variable REGISTRY_DAILY_REQUEST_LIMIT, defaulting to the
# free-tier figure. Once the plan tier is confirmed as paid, raise the variable
# and this stops firing rather than crying wolf daily.
#
# Needs Account Analytics Read on CLOUDFLARE_API_TOKEN. If the token lacks it the
# job fails naming the permission, rather than reporting zero requests - a quota
# alarm that cannot fire is worse than none, because it is believed.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: ${{ secrets.SPARTAN_SLACK_WEBHOOK_CICD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check yesterday's request volume
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          since=$(date -u -d '2 days ago' +%Y-%m-%d)
          until=$(date -u -d 'yesterday' +%Y-%m-%d)
          python3 scripts/registry_quota_check.py \
            --account "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            --script c0x12c-tf-registry \
            --since "$since" \
            --until "$until" \
            --limit "${{ vars.REGISTRY_DAILY_REQUEST_LIMIT || '100000' }}"
      - name: Notify Slack
        # The webhook is promoted to a JOB-level env var (see `env:` on the job) so it
        # can be read here. `secrets.*` is NOT valid in a step-level `if:` - GitHub
        # rejects the whole workflow file, which would break the alerting job entirely.
        # Verified empirically before settling on this shape.
        #
        # An unset webhook must never fail the alerting job: failing here would silence
        # the very alert the job exists to deliver.
        if: failure() && env.SLACK_WEBHOOK != ''
        uses: c0x12c/gh-actions-slack-notify@v0.3.0
        with:
          webhook_url: ${{ env.SLACK_WEBHOOK }}
          title: '🟠 *Registry quota check failed*'
          message: |
            The check did not pass. Either yesterday's request volume crossed the configured
            share of the daily limit, or the check itself could not read the analytics API -
            the run log distinguishes them.

            If volume: Workers Free is a hard daily cap, not a throttle. Past it the registry
            stops serving until UTC midnight and every `terraform init` fails at once.

            Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view logs>
