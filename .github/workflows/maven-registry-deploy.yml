name: Maven Registry Deploy
on:
  push:
    branches: [master]
    paths:
      - tools/maven-registry/**
      - .github/scripts/maven-registry-deploy/**
      - .github/workflows/maven-registry-deploy.yml
  pull_request:
    paths:
      - tools/maven-registry/**
      - .github/scripts/maven-registry-deploy/**
      - .github/workflows/maven-registry-deploy.yml
  workflow_dispatch:
    inputs:
      bootstrap:
        type: boolean
        default: false
      zone_id:
        type: string
permissions:
  contents: read
# Queue deploys rather than cancelling an in-flight Worker update.
concurrency:
  # PR validation gets its own group: a pending PR run would otherwise replace a queued deploy.
  group: maven-registry-deploy-${{ github.event_name == 'pull_request' && github.run_id || 'main' }}
  cancel-in-progress: false
env:
  READ_HOST: maven.c0x12c.com
  PUBLISH_HOST: maven-publish.c0x12c.com
  BUCKET: c0x12c-maven
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: |
          node --check tools/maven-registry/worker.js
          node --check tools/maven-registry/oidc.js
      - run: |
          node tools/maven-registry/test_oidc.mjs
          node tools/maven-registry/test_worker.mjs
  deploy:
    # Manual dispatch deploys unless it is a bootstrap run (the bucket must exist first);
    # master auto-deploy requires the gate.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.bootstrap != true && github.ref == 'refs/heads/master') ||
      (github.event_name == 'push' && vars.MAVEN_REGISTRY_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require allowed owners and repos
        env:
          OWNERS: ${{ vars.MAVEN_ALLOWED_OWNERS }}
          REPOS: ${{ vars.MAVEN_ALLOWED_REPOS }}
        run: test -n "$OWNERS" && test -n "$REPOS" || { echo '::error::MAVEN_ALLOWED_OWNERS and MAVEN_ALLOWED_REPOS must not be empty'; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: |
          node tools/maven-registry/test_oidc.mjs
          node tools/maven-registry/test_worker.mjs
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/maven-registry
          command: deploy --var ALLOWED_OWNERS:${{ vars.MAVEN_ALLOWED_OWNERS }} --var ALLOWED_REPOS:${{ vars.MAVEN_ALLOWED_REPOS }}
      - run: bash .github/scripts/maven-registry-deploy/smoke.sh
        env:
          PUBLISH_HOST: ${{ env.PUBLISH_HOST }}
  bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap == true && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: bash .github/scripts/maven-registry-deploy/bootstrap.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ env.BUCKET }}
          READ_HOST: ${{ env.READ_HOST }}
          ZONE_ID: ${{ inputs.zone_id }}
