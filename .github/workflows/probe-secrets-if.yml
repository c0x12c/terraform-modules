name: probe-secrets-if
on:
  push:
    branches: [ducdt/alert-slack-notify]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: present
        if: secrets.SPARTAN_SLACK_WEBHOOK_CICD != ''
        run: echo "GUARD_TRUE"
      - name: absent
        if: secrets.DEFINITELY_NOT_SET_XYZ != ''
        run: echo "GUARD_SHOULD_NOT_RUN"
