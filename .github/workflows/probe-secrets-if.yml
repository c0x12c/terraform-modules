name: probe-secrets-if
on:
  push:
    branches: [ducdt/alert-slack-notify]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: ${{ secrets.SPARTAN_SLACK_WEBHOOK_CICD }}
      NOT_SET: ${{ secrets.DEFINITELY_NOT_SET_XYZ }}
    steps:
      - name: guard true when secret present
        if: env.SLACK_WEBHOOK != ''
        run: echo "GUARD_TRUE_OK"
      - name: guard false when secret absent
        if: env.NOT_SET != ''
        run: echo "SHOULD_NOT_RUN"
