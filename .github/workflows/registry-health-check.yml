name: registry-health-check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: ${{ secrets.SPARTAN_SLACK_WEBHOOK_CICD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install -r tools/registry/requirements.txt
      - name: Run registry health check
        env:
          # Dedicated R2 token for the health-check cron, separate from the
          # publish credentials, so it can be rotated/revoked independently if
          # the cron secret context is ever exposed.
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_HEALTHCHECK_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_HEALTHCHECK_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/registry_health_check.py \
            --r2-bucket "${{ vars.R2_BUCKET }}" \
            --report-file health-report.md
      - name: Open or refresh failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create registry-health --color FBCA04 \
            --description "Registry health-check discrepancy" --force || true
          TITLE="Registry health-check failure"
          # Only refresh the automation-owned issue so humans keep incident control.
          existing=$(gh issue list --state open --label registry-health \
            --search "\"$TITLE\" in:title" --json number,author \
            --jq '[.[] | select(.author.is_bot==true)][0].number // empty')
          body=$(cat health-report.md 2>/dev/null || echo "Health check failed before producing a report.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --label registry-health --body "$body" \
              --assignee "${{ vars.REGISTRY_ALERT_OWNER }}"
          fi
      - name: Resolve issue on success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Registry health-check failure"
          # Close only the bot-authored tracker, never a human-filed incident.
          existing=$(gh issue list --state open --label registry-health \
            --search "\"$TITLE\" in:title" --json number,author \
            --jq '[.[] | select(.author.is_bot==true)][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Registry health-check passed; closing."
            gh issue close "$existing"
          fi
      - name: Notify Slack
        # The webhook is promoted to a JOB-level env var (see `env:` on the job) so it
        # can be read here. `secrets.*` is NOT valid in a step-level `if:` - GitHub
        # rejects the whole workflow file, which would break the alerting job entirely.
        # Verified empirically before settling on this shape.
        #
        # An unset webhook must never fail the alerting job: failing here would silence
        # the very alert the job exists to deliver.
        if: failure() && env.SLACK_WEBHOOK != ''
        uses: c0x12c/gh-actions-slack-notify@v0.3.0
        with:
          webhook_url: ${{ env.SLACK_WEBHOOK }}
          title: '🟠 *Registry coverage check failed*'
          message: |
            A tagged module version may be missing from the registry. Consumers pinning a range resolve to the older version silently - no error anywhere.\n\nThis check caught a module stranded for 31 days once already.\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view logs>
