apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-dashboard" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Values.monitoring.dashboardNamespace | quote }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Redpanda
data:
  redpanda.json: {{ .Files.Get "dashboards/redpanda.json" | quote }}
