{{- range $name, $t := .Values.tenants }}
---
apiVersion: cluster.redpanda.com/v1alpha2
kind: User
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  cluster:
    clusterRef:
      name: {{ $.Values.clusterName }}
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: {{ $t.secretName }}
          key: password
  authorization:
    acls:
      {{- toYaml $t.acls | nindent 6 }}
{{- end }}
