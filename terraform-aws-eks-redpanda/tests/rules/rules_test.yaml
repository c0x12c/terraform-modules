  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "one of three broker scrapes failing",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{namespace=\"redpanda-test\",service=\"redpanda\",pod=\"broker-0\"}",
          "values": "1+0x25"
        },
        {
          "series": "up{namespace=\"redpanda-test\",service=\"redpanda\",pod=\"broker-1\"}",
          "values": "1+0x25"
        },
        {
          "series": "up{namespace=\"redpanda-test\",service=\"redpanda\",pod=\"broker-2\"}",
          "values": "0+0x25"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "0m",
          "alertname": "RedpandaBrokerDown",
          "exp_alerts": []
        },
        {
          "eval_time": "20m",
          "alertname": "RedpandaBrokerDown",
          "exp_alerts": [
            {
              "exp_labels": {
                "severity": "critical"
              },
              "exp_annotations": {
                "title": "Redpanda broker down",
                "summary": "Brokers up: 2 brokers; threshold: 3 brokers.",
                "runbook_url": "https://example.invalid/runbook",
                "dashboard_url": "https://example.invalid/dashboard"
              }
            }
          ]
        }
      ]
    },
