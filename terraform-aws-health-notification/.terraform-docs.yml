# lockfile: false keeps the Providers table on the versions.tf constraints
# (>= x, ~> y) rather than the exact versions a `terraform init` resolves into
# .terraform.lock.hcl. CI now runs the docs check BEFORE init, so there is no
# lock file there and this setting is belt-and-braces - it still matters for a
# local regeneration in a directory where someone has run init by hand.
formatter: markdown table

settings:
  lockfile: false

output:
  file: README.md
  mode: inject
